<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
    <title>MindMap</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="page-auth">

    <div class="form-container">
        <div class="auth-logo">âœ¦ MindMap</div>

        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
            <button type="button" class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- login form -->
        <form id="login-form">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" autocomplete="email" required>

            <label for="login-password">Password</label>
            <input type="password" id="login-password" autocomplete="current-password" required>

            <div class="show-password">
                <label for="show-login-pw">Show Password</label>
                <input type="checkbox" id="show-login-pw">
            </div>

            <button type="submit">Login</button>
            <div id="login-status"></div>
        </form>

        <!-- signup form -->
        <form id="signup-form" class="form-hidden">
            <label for="signup-username">Username</label>
            <input type="text" id="signup-username" autocomplete="username" required>

            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" autocomplete="email" required>

            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" autocomplete="new-password" required>

            <div class="show-password">
                <label for="show-signup-pw">Show Password</label>
                <input type="checkbox" id="show-signup-pw">
            </div>

            <button type="submit">Create Account</button>
            <div id="signup-status"></div>
        </form>
    </div>

    <script>
        let pollTimer = null;

        function switchTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('login-form').classList.toggle('form-hidden', !isLogin);
            document.getElementById('signup-form').classList.toggle('form-hidden', isLogin);
            document.getElementById('tab-login').classList.toggle('active', isLogin);
            document.getElementById('tab-signup').classList.toggle('active', !isLogin);
        }

        // show/hide password â€” login
        document.getElementById('show-login-pw').addEventListener('change', function () {
            document.getElementById('login-password').type = this.checked ? 'text' : 'password';
        });

        // show/hide password â€” signup
        document.getElementById('show-signup-pw').addEventListener('change', function () {
            document.getElementById('signup-password').type = this.checked ? 'text' : 'password';
        });

        // login submit
        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const statusEl = document.getElementById('login-status');
            const email    = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();

            try {
                const response = await fetch('http://localhost:3002/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify({
                        id: data.user.id,
                        username: data.user.username,
                        email: data.user.email
                    }));
                    localStorage.setItem('token', data.token);
                    window.location.href = 'confirmation.html';
                } else {
                    statusEl.textContent = data.error || 'Failed to log in.';
                    statusEl.style.color = '#f8c537';
                }
            } catch (err) {
                statusEl.textContent = 'An error occurred. Please try again.';
                statusEl.style.color = '#f8c537';
            }
        });

        // signup submit
        document.getElementById('signup-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const statusEl  = document.getElementById('signup-status');
            const username  = document.getElementById('signup-username').value.trim();
            const email     = document.getElementById('signup-email').value.trim();
            const password  = document.getElementById('signup-password').value.trim();

            try {
                const response = await fetch('http://localhost:3002/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    statusEl.textContent = 'Account created! Check your email to confirm, then come back and log in.';
                    statusEl.style.color = '#5eead4';
                    startPollingConfirmation(email);
                } else {
                    statusEl.textContent = data.error || 'Failed to sign up.';
                    statusEl.style.color = '#f8c537';
                }
            } catch (err) {
                statusEl.textContent = 'An error occurred. Please try again.';
                statusEl.style.color = '#f8c537';
            }
        });

        // poll for email confirmation after signup
        function startPollingConfirmation(email) {
            if (pollTimer) clearInterval(pollTimer);
            const poll = async () => {
                try {
                    const resp = await fetch(`http://localhost:3002/is-confirmed?email=${encodeURIComponent(email)}`);
                    if (!resp.ok) return;
                    const data = await resp.json();
                    if (data.confirmed) {
                        clearInterval(pollTimer);
                        document.getElementById('signup-status').textContent = 'Email confirmed! Redirecting...';
                        window.location.href = 'confirmation.html';
                    }
                } catch (err) {
                    console.warn('Confirm poll failed', err);
                }
            };
            poll();
            pollTimer = setInterval(poll, 4000);
        }
    </script>
</body>
</html>
