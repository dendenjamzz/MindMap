<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet/styles.css">
    <title>Account Confirmation</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="page-confirmation">
    <div class="confirmation-page">
        <div class="side-window" id="side-window">
            <div class="profile-header">
                <div class="account-icon" id="account-icon" ></div>
                <div class="account-details">
                    <p id="user-name">Username</p>
                    <p id="user-email">Email</p>
                </div>
            </div>
            <button class="button" id="toggle-theme" onclick="toggleTheme()">Switch to Dark Mode</button>
            <button class="button" id="get-reports" onclick="showReportInput()">Submit a Report</button>
            <button class="button" id="admin-btn" onclick="window.location.href='admin.html'">Manage Reports</button>

            <div id="report-container" class="report-container">
                <h3>Write Your Report</h3>
                <textarea id="report-input" class="report-input" placeholder="Write your report here..."></textarea>
                <button class="button" onclick="submitReport()">Submit Report</button>
                <button class="button" onclick="cancelReport()">Cancel</button>
            </div>
        </div>

        <div class="main-content" id="main-content">
            <h1>Welcome to MindMap!</h1>
            <p>Your email has been successfully confirmed.</p>
            <p id="constellations-status">Constellations Created: <span id="constellations-count">0</span></p>
            <div id="health-banner">
                Some services are unreachable. Loading or processing may fail.
            </div>
            <button class="button" id="start-new" onclick="window.location.href='newc.html'">Start a New Constellation</button>
            <button class="button" id="refresh-constellations" onclick="refreshConstellations()">Refresh Constellations</button>
            
            <div id="saved-constellations">
                <h2>My Saved Constellations</h2>
                <div id="constellations-loading" class="loading">Loading your constellations...</div>
                <div class="constellation-list" id="constellation-list"></div>
            </div>
        </div>
    </div>

    <button class="back-login" onclick="window.location.href='login.html'">Back to Login</button>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
                
            let user = JSON.parse(localStorage.getItem('user'));
            const pendingEmail = localStorage.getItem('pendingEmail');


            if (!user && pendingEmail) {
                document.getElementById('user-name').textContent = '';
                document.getElementById('user-email').textContent = pendingEmail;

                try {
                    const resp = await fetch(`http://localhost:3002/is-confirmed?email=${encodeURIComponent(pendingEmail)}`);
                    if (resp.ok) {
                        const data = await resp.json();
                        if (data.confirmed && data.user) {
                            user = data.user;
                            localStorage.setItem('user', JSON.stringify(user));
                        }
                    }
                } catch (err) {
                    console.warn('Could not fetch user data:', err);
                }
            }

            checkHealth();

            if (user) {
                document.getElementById('user-name').textContent = user.username || user.name || '';
                document.getElementById('user-email').textContent = user.email;

                // Show admin button — server enforces access, this just controls visibility
                fetch('http://localhost:3002/admin/check', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                }).then(r => {
                    if (r.ok) document.getElementById('admin-btn').style.display = 'block';
                }).catch(() => {});

                //const profileImage = user.profileImage || 'default.png';
                //document.getElementById('account-icon').style.backgroundImage = `url('${profileImage}')`;
            }

            if (pendingEmail && !user) {
                const poll = async () => {
                    try {
                        const resp = await fetch(`http://localhost:3002/is-confirmed?email=${encodeURIComponent(pendingEmail)}`);
                        if (!resp.ok) return;
                        const data = await resp.json();
                        if (data.confirmed) {
                            document.getElementById('constellations-status').textContent = 'Email confirmed.';
                            localStorage.setItem('emailConfirmedFlag', 'true');
                            if (data.user) {
                                user = data.user;
                                localStorage.setItem('user', JSON.stringify(user));
                                location.reload();
                            }
                        }
                    } catch (err) {
                        console.warn('Polling confirmation failed', err);
                    }
                };
                poll();
                setInterval(poll, 4000);
            }

            const theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'light') {
                document.body.classList.add('light');
                document.getElementById('toggle-theme').textContent = 'Switch to Dark Mode';
            } else {
                document.body.classList.remove('light');
                document.getElementById('toggle-theme').textContent = 'Switch to Light Mode';
            }

            if (user && user.id) {
                loadSavedConstellations(user.id);
            } else {
                document.getElementById('constellations-loading').textContent = 'Please log in to view your constellations.';
            }
        });

        async function loadSavedConstellations() {
            const user = JSON.parse(localStorage.getItem('user'));
            const token = localStorage.getItem('token');
            
            const userId = user.id;

            const listEl = document.getElementById('constellation-list');
            const countEl = document.getElementById('constellations-count');

            if (!listEl) return;

            if (!user || !token) {
                listEl.innerHTML = '<p>Please log in again.</p>';
                return;
            }

            try {
                const response = await fetch(`http://localhost:3002/constellations/${userId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Server error');

                const constellation = await response.json();
                const loadingEl = document.getElementById('constellations-loading');
                if (loadingEl) loadingEl.style.display = 'none';
                if (countEl) countEl.textContent = constellation.length;

                listEl.innerHTML = '';

                if (constellation.length === 0) {
                    listEl.innerHTML = '<p>No saved constellations.</p>';
                    return;
                }

                window.constellationMap = window.constellationMap || {};
                constellation.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'constellation-item';

                    // Folosim numele coloanelor din baza de date
                    const cId = c.constellation_id;
                    window.constellationMap[cId] = c;

                    item.innerHTML = `
                        <div class="constellation-preview" id="preview-${cId}"></div>
                        <div class="constellation-info">
                            <div class="constellation-name">${c.name || 'Unnamed'}</div>
                            <div class="constellation-actions">
                                <button class="card-action-btn btn-edit"   onclick="viewConstellation(${cId})">Edit</button>
                                <button class="card-action-btn btn-delete" onclick="deleteConstellation(${cId})">Delete</button>
                                <button class="card-action-btn btn-png"    onclick="downloadConstellationImage(window.constellationMap[${cId}])">PNG</button>
                                <button class="card-action-btn btn-report" onclick="downloadConstellationReport(window.constellationMap[${cId}])">CSV Report</button>
                            </div>
                        </div>
                    `;
                    listEl.appendChild(item);

                    if (c.constellation_data) {
                        try {
                            const data = typeof c.constellation_data === 'string'
                                ? JSON.parse(c.constellation_data)
                                : c.constellation_data;
                            const svgEl = createMiniConstellation(data, 250);
                            document.getElementById(`preview-${cId}`).appendChild(svgEl);
                        } catch (e) {
                            console.error('Preview render error:', e);
                        }
                    }
                });

            } catch (error) {
                console.error('Error loading constellations:', error);
                listEl.innerHTML = '<p style="color:red;">Error loading constellations.</p>';
            }
        }


        function renderMiniPreview(containerId, rawData) {
            try {
                const data = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
                if (!data || !data.nodes) return;

                const svg = d3.select(`#${containerId}`)
                    .append("svg")
                    .attr("width", "100%")
                    .attr("height", "100%");

                const width = document.getElementById(containerId).offsetWidth || 250;
                const height = 150;

                const simulation = d3.forceSimulation(data.nodes)
                    .force("link", d3.forceLink(data.links).id(d => d.id).distance(20))
                    .force("charge", d3.forceManyBody().strength(-10))
                    .force("center", d3.forceCenter(width / 2, height / 2))
                    .stop();

                for (let i = 0; i < 50; ++i) simulation.tick();

                svg.append("g").selectAll("line").data(data.links).enter().append("line")
                    .attr("stroke", "#5eead4").attr("stroke-opacity", 0.3)
                    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);

                svg.append("g").selectAll("circle").data(data.nodes).enter().append("circle")
                    .attr("r", 2).attr("fill", "#f8c537")
                    .attr("cx", d => d.x).attr("cy", d => d.y);
            } catch (e) { console.error("D3 Mini error:", e); }
        }
                


        function renderMiniPreview(containerId, rawData) {
            try {
                const container = document.getElementById(containerId);
                if (!container) return;

                // Parsăm datele dacă sunt string (LONGTEXT în MySQL)
                const data = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
                if (!data || !data.nodes) return;

                const width = container.offsetWidth || 250;
                const height = 150;

                // Curățăm containerul înainte de desenare
                d3.select(`#${containerId}`).select("svg").remove();

                const svg = d3.select(`#${containerId}`)
                    .append("svg")
                    .attr("width", "100%")
                    .attr("height", height)
                    .attr("viewBox", `0 0 ${width} ${height}`);

                const simulation = d3.forceSimulation(data.nodes)
                    .force("link", d3.forceLink(data.links).id(d => d.id).distance(25))
                    .force("charge", d3.forceManyBody().strength(-15))
                    .force("center", d3.forceCenter(width / 2, height / 2))
                    .stop(); // Oprim simularea automată pentru a randa rapid

                // Rulăm simularea manual câteva cadre pentru a poziționa nodurile
                for (let i = 0; i < 60; ++i) simulation.tick();

                // Desenăm liniile
                svg.append("g")
                    .selectAll("line")
                    .data(data.links)
                    .enter().append("line")
                    .attr("stroke", "#5eead4")
                    .attr("stroke-opacity", 0.4)
                    .attr("stroke-width", 1)
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                // Desenăm nodurile (stelele)
                svg.append("g")
                    .selectAll("circle")
                    .data(data.nodes)
                    .enter().append("circle")
                    .attr("r", 2.5)
                    .attr("fill", "#f8c537")
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y);

            } catch (err) {
                console.error("Eroare D3 Preview:", err);
            }
        }


        function renderMiniGraph(containerId, rawData) {
            try {
                const data = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
                if (!data || !data.nodes) return;

                const container = document.getElementById(containerId);
                const width = container.offsetWidth || 250;
                const height = 150;

                const svg = d3.select(`#${containerId}`)
                    .append("svg")
                    .attr("width", "100%")
                    .attr("height", height);

                const simulation = d3.forceSimulation(data.nodes)
                    .force("link", d3.forceLink(data.links).id(d => d.id).distance(20))
                    .force("charge", d3.forceManyBody().strength(-15))
                    .force("center", d3.forceCenter(width / 2, height / 2));

                const link = svg.append("g").selectAll("line")
                    .data(data.links).enter().append("line")
                    .attr("stroke", "#5eead4").attr("stroke-opacity", 0.4);

                const node = svg.append("g").selectAll("circle")
                    .data(data.nodes).enter().append("circle")
                    .attr("r", 2).attr("fill", "#f8c537");

                simulation.on("tick", () => {
                    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
                        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                    node.attr("cx", d => d.x).attr("cy", d => d.y);
                });
            } catch (e) { console.error("D3 Error:", e); }
        }       

        function _shapeNodePath(shape, cx, cy, r) {
            switch (shape) {
                case 'star': {
                    const ir = r * 0.42;
                    let d = '';
                    for (let i = 0; i < 10; i++) {
                        const rad = i % 2 === 0 ? r : ir;
                        const a = (i * Math.PI / 5) - Math.PI / 2;
                        d += (i === 0 ? 'M' : 'L') + (cx + rad * Math.cos(a)).toFixed(2) + ',' + (cy + rad * Math.sin(a)).toFixed(2);
                    }
                    return d + 'Z';
                }
                case 'diamond':
                    return `M${cx.toFixed(2)},${(cy-r).toFixed(2)} L${(cx+r*0.65).toFixed(2)},${cy.toFixed(2)} L${cx.toFixed(2)},${(cy+r).toFixed(2)} L${(cx-r*0.65).toFixed(2)},${cy.toFixed(2)}Z`;
                case 'triangle': {
                    const h = r * 0.866;
                    return `M${cx.toFixed(2)},${(cy-r).toFixed(2)} L${(cx+h).toFixed(2)},${(cy+r*0.5).toFixed(2)} L${(cx-h).toFixed(2)},${(cy+r*0.5).toFixed(2)}Z`;
                }
                default:
                    return `M${(cx+r).toFixed(2)},${cy.toFixed(2)} A${r},${r} 0 1,1 ${(cx-r).toFixed(2)},${cy.toFixed(2)} A${r},${r} 0 1,1 ${(cx+r).toFixed(2)},${cy.toFixed(2)}Z`;
            }
        }

        function _brighten(hex) {
            const n = parseInt((hex || '#888888').replace('#',''), 16);
            const r = Math.min(255, (n >> 16) + 60);
            const g = Math.min(255, ((n >> 8) & 0xff) + 60);
            const b = Math.min(255, (n & 0xff) + 60);
            return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
        }

        function createMiniConstellation(data, size = 200) {
            const isExport = size > 400;

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.style.width = '100%';
            svg.style.height = '100%';
            svg.style.display = 'block';

            // Background rect (CSS background is lost when serializing to image)
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('width', size);
            bg.setAttribute('height', size);
            bg.setAttribute('fill', '#0a0f1c');
            svg.appendChild(bg);

            if (!data || !data.nodes || data.nodes.length === 0) return svg;

            const style = data.style || {};
            const rootColor = style.rootColor || '#f8c537';
            const nodeColor = style.nodeColor || '#5eead4';
            const linkColor = style.linkColor || '#5eead4';
            const shape = style.shape || 'star';

            const nodeR     = Math.max(3, size / (isExport ? 70 : 55));
            const fontSize  = isExport ? Math.max(12, size / 75) : 0;
            const linkW     = isExport ? 2 : 1;

            // Clone nodes so we don't mutate saved data
            const nodes = data.nodes.map(n => ({ ...n }));
            const links = data.links || [];

            // Assign positions if missing
            if (!nodes.every(n => isFinite(n.x) && isFinite(n.y))) {
                const cx = size / 2, cy = size / 2, rad = size * 0.35;
                nodes.forEach((n, i) => {
                    const a = (i / nodes.length) * 2 * Math.PI;
                    n.x = cx + Math.cos(a) * rad;
                    n.y = cy + Math.sin(a) * rad;
                });
            }

            // Bounding-box scale to fit with padding
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            nodes.forEach(n => {
                if (n.x < minX) minX = n.x; if (n.x > maxX) maxX = n.x;
                if (n.y < minY) minY = n.y; if (n.y > maxY) maxY = n.y;
            });
            const pad    = size * (isExport ? 0.12 : 0.15);
            const scaleF = Math.min((size - pad * 2) / (maxX - minX || 1), (size - pad * 2) / (maxY - minY || 1));
            const tx     = (size - (maxX - minX) * scaleF) / 2 - minX * scaleF;
            const ty     = (size - (maxY - minY) * scaleF) / 2 - minY * scaleF;
            const gx = v => v * scaleF + tx;
            const gy = v => v * scaleF + ty;

            // Node lookup map for links
            const nodeById = {};
            nodes.forEach(n => { nodeById[n.id] = n; });

            // Links
            links.forEach(lnk => {
                const s = nodeById[lnk.source?.id ?? lnk.source];
                const t = nodeById[lnk.target?.id ?? lnk.target];
                if (!s || !t) return;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', gx(s.x).toFixed(2));
                line.setAttribute('y1', gy(s.y).toFixed(2));
                line.setAttribute('x2', gx(t.x).toFixed(2));
                line.setAttribute('y2', gy(t.y).toFixed(2));
                line.setAttribute('stroke', linkColor);
                line.setAttribute('stroke-opacity', '0.55');
                line.setAttribute('stroke-width', linkW);
                svg.appendChild(line);
            });

            // Nodes
            nodes.forEach(node => {
                const cx   = gx(node.x);
                const cy   = gy(node.y);
                const isRoot = node.type === 'root';
                const color  = isRoot ? rootColor : nodeColor;
                const r      = isRoot ? nodeR * 1.35 : nodeR;

                const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                el.setAttribute('d', _shapeNodePath(shape, cx, cy, r));
                el.setAttribute('fill', color);
                el.setAttribute('stroke', _brighten(color));
                el.setAttribute('stroke-width', isExport ? '2' : '1');
                svg.appendChild(el);

                if (fontSize > 0) {
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', cx.toFixed(2));
                    text.setAttribute('y', (cy - r - (isExport ? 6 : 3)).toFixed(2));
                    text.setAttribute('fill', '#e2e8f0');
                    text.setAttribute('font-size', `${fontSize}px`);
                    text.setAttribute('font-family', 'Space Grotesk, Arial, sans-serif');
                    text.setAttribute('font-weight', isRoot ? '700' : '400');
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('paint-order', 'stroke');
                    text.setAttribute('stroke', '#0a0f1c');
                    text.setAttribute('stroke-width', isExport ? '4' : '2');
                    text.textContent = node.id;
                    svg.appendChild(text);
                }
            });

            return svg;
        }

        function viewConstellation(cId) {
            const c = window.constellationMap && window.constellationMap[cId];
            if (!c) return alert('Constellation data not loaded yet. Try refreshing.');
            localStorage.setItem('editConstellation', JSON.stringify(c));
            window.location.href = 'newc.html?edit=' + cId;
        }

        async function deleteConstellation(cId) {
            if (!confirm('Are you sure you want to delete this constellation? This cannot be undone.')) return;

            const token = localStorage.getItem('token');
            if (!token) return alert('Not logged in.');

            try {
                const res = await fetch(`http://localhost:3002/constellation/${cId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    return alert('Delete failed: ' + (err.message || res.status));
                }

                // Remove card from UI and update count
                const item = document.getElementById(`preview-${cId}`)?.closest('.constellation-item');
                if (item) item.remove();
                if (window.constellationMap) delete window.constellationMap[cId];

                const countEl = document.getElementById('constellations-count');
                if (countEl) countEl.textContent = Math.max(0, parseInt(countEl.textContent) - 1);
            } catch (e) {
                alert('Network error: ' + e.message);
            }
        }

        function shareConstellationLink(constellation) {
            const link = `${window.location.origin}/newc.html?view=${constellation.id}`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(link)
                    .then(() => alert('Shareable link copied to clipboard!'))
                    .catch(() => alert('Share link: ' + link));
            } else {
                alert('Share link: ' + link);
            }
        }

        function downloadConstellationImage(constellation, previewEl) {
            let data = null;
            try {
                data = typeof constellation.constellation_data === 'string'
                    ? JSON.parse(constellation.constellation_data)
                    : constellation.constellation_data;
            } catch (err) {
                console.error('Could not parse constellation data for download', err);
            }

            if (!data) {
                alert('No data available to download.');
                return;
            }

            const exportSize = 1600;
            const svgEl = createMiniConstellation(data, exportSize);
            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(svgEl);
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);

            const image = new Image();
            image.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = image.width || exportSize;
                canvas.height = image.height || exportSize;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#0a0f1c';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

                canvas.toBlob((blob) => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `${constellation.name || 'constellation'}.png`;
                    a.click();
                    URL.revokeObjectURL(a.href);
                }, 'image/png');

                URL.revokeObjectURL(url);
            };
            image.src = url;
        }

        function csvEscape(val) {
            const s = String(val === null || val === undefined ? '' : val);
            return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s.replace(/"/g, '""')}"` : s;
        }

        function downloadConstellationReport(constellation) {
            let data = null;
            try {
                data = typeof constellation.constellation_data === 'string'
                    ? JSON.parse(constellation.constellation_data)
                    : constellation.constellation_data;
            } catch (err) {
                console.error('Could not parse constellation data for report', err);
            }

            if (!data) {
                alert('No data available to download.');
                return;
            }

            const rows = [];

            // --- Metadata ---
            rows.push(['Constellation Report']);
            rows.push(['Name', csvEscape(constellation.name || 'Untitled')]);
            rows.push(['Created', csvEscape(constellation.created_at || 'n/a')]);
            rows.push(['Nodes', (data.nodes || []).length]);
            rows.push(['Links', (data.links || []).length]);
            rows.push([]);

            // --- Nodes ---
            rows.push(['NODES']);
            rows.push(['Word', 'Type', 'Categories']);
            (data.nodes || []).forEach(n => {
                rows.push([
                    csvEscape(n.id),
                    csvEscape(n.type || ''),
                    csvEscape((n.categories || []).join('; '))
                ]);
            });
            rows.push([]);

            // --- Connections ---
            rows.push(['CONNECTIONS']);
            rows.push(['Source', 'Target']);
            (data.links || []).forEach(l => {
                const src = l.source?.id ?? l.source;
                const tgt = l.target?.id ?? l.target;
                rows.push([csvEscape(src), csvEscape(tgt)]);
            });
            rows.push([]);

            // --- Economic Tags ---
            rows.push(['ECONOMIC TAGS']);
            rows.push(['Tag']);
            const economy = Array.isArray(data.economy) ? data.economy : [];
            if (economy.length) economy.forEach(e => rows.push([csvEscape(e)]));
            else rows.push(['none']);
            rows.push([]);

            // --- Trending Topics ---
            rows.push(['TRENDING TOPICS']);
            rows.push(['Topic']);
            const trends = Array.isArray(data.trends) ? data.trends : [];
            if (trends.length) trends.forEach(t => rows.push([csvEscape(t)]));
            else rows.push(['none']);
            rows.push([]);

            // --- Suggested Careers ---
            rows.push(['SUGGESTED CAREERS']);
            rows.push(['Career']);
            const careers = Array.isArray(data.careers) ? data.careers : [];
            if (careers.length) careers.forEach(c => rows.push([csvEscape(c)]));
            else rows.push(['none']);

            const csv = rows.map(r => r.join(',')).join('\r\n');
            const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${constellation.name || 'constellation'}-report.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function refreshConstellations() {
            const user = JSON.parse(localStorage.getItem('user'));
            console.log('Manual refresh - User data:', user);
            if (user && user.id) {
                const loadingEl = document.getElementById('constellations-loading');
                loadingEl.style.display = 'inline-flex';
                loadingEl.classList.add('loading');
                loadingEl.textContent = 'Loading your constellations...';
                document.getElementById('constellation-list').innerHTML = '';
                loadSavedConstellations(user.id);
            } else {
                alert('No user logged in. Please log in first.');
                console.error('No user or user ID found in localStorage');
            }
        }

        function toggleTheme() {
            const body = document.body;
            const button = document.getElementById('toggle-theme');
            const nowLight = body.classList.toggle('light');
            if (nowLight) {
                button.textContent = 'Switch to Dark Mode';
                localStorage.setItem('theme', 'light');
            } else {
                button.textContent = 'Switch to Light Mode';
                localStorage.setItem('theme', 'dark');
            }
        }

        function generateUserStar() {
            const iconEl = document.getElementById('account-icon');
            const userName = document.getElementById('user-name').textContent || "Guest";

            // Listă de culori frumoase pentru stele
            const colors = ['#f8c537', '#5eead4', '#ff4d4d', '#9fb2d7', '#c084fc', '#fb923c'];
            
            // Alegem o culoare bazată pe lungimea numelui (ca să fie "semnatura" lui)
            const colorIndex = userName.length % colors.length;
            const starColor = colors[colorIndex];

            // Desenul SVG al stelei
            const starSvg = `
                <svg viewBox="0 0 24 24" fill="${starColor}" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279-7.416-3.967-7.417 3.967 1.481-8.279-6.064-5.828 8.332-1.151z"/>
                </svg>
            `;

            iconEl.innerHTML = starSvg;
        }

        // Apelăm funcția în interiorul window.onload, după ce se încarcă datele userului
        window.onload = async function() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user) {
                document.getElementById('user-name').textContent = user.username || user.name;
                document.getElementById('user-email').textContent = user.email;
                
                // Generăm steaua după ce avem numele userului
                generateUserStar();
                
                // Încărcăm constelațiile (asigură-te că folosești varianta cu TOKEN)
                await loadSavedConstellations();
            } else {
                window.location.href = 'login.html';
            }
            
            if (typeof checkHealth === 'function') checkHealth();
        };

        function showReportInput() {
            document.getElementById('report-container').style.display = 'block';
        }

        function submitReport() {
            const reportContent = document.getElementById('report-input').value;
            if (!reportContent) {
                alert('Please enter a report.');
                return;
            }

            const user = JSON.parse(localStorage.getItem('user'));
            console.log('User data from localStorage:', user);
            if (!user || !user.id) {
                alert('Please log in first to submit a report.');
                window.location.href = 'login.html';
                return;
            }

            const token = localStorage.getItem('token');
            if (!token) {
                alert('Please log in first to submit a report.');
                window.location.href = 'login.html';
                return;
            }

            const reportData = { report: reportContent };

            fetch('http://localhost:3002/submit-report', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(reportData),
            })
            .then(response => {
                console.log('Response status:', response.status);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                alert(data.message);
                document.getElementById('report-input').value = '';
                document.getElementById('report-container').style.display = 'none';
            })
            .catch(error => {
                console.error('Error submitting the report:', error);
                alert('Error submitting the report: ' + error.message);
            });
        }

        function cancelReport() {
            document.getElementById('report-container').style.display = 'none';
        }

        async function checkHealth() {
            const banner = document.getElementById('health-banner');
            if (!banner) return;
            let nodeOk = false;
            let flaskOk = false;
            try {
                const r = await fetch('http://localhost:3002/health', { method: 'GET' });
                nodeOk = r.ok;
            } catch (_) { nodeOk = false; }

            try {
                const f = await fetch('http://127.0.0.1:5000/health');
                flaskOk = f.ok || f.status === 404;
            } catch (_) { flaskOk = false; }

            if (!nodeOk || !flaskOk) {
                banner.style.display = 'block';
                banner.textContent = `Some services are unreachable: Node ${nodeOk ? 'ok' : 'down'}, NLP ${flaskOk ? 'ok' : 'down'}.`;
            } else {
                banner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
