<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Constellations</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #080d1a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 64px;
            background: rgba(10, 15, 28, 0.95);
            border-bottom: 1px solid rgba(94, 234, 212, 0.12);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .navbar-logo {
            font-size: 18px;
            font-weight: 700;
            color: #f8c537;
            letter-spacing: 0.5px;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 40px;
            padding: 6px 14px 6px 8px;
        }

        .user-star { width: 28px; height: 28px; }

        .user-info { line-height: 1.3; }
        .user-info .name { font-size: 13px; font-weight: 600; color: #f1f5f9; }
        .user-info .email { font-size: 11px; color: #94a3b8; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            border: none;
            transition: opacity 0.15s, transform 0.1s;
        }
        .btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        .btn-ghost {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.12);
            color: #94a3b8;
        }
        .btn-ghost:hover { border-color: rgba(255,255,255,0.25); color: #e2e8f0; opacity: 1; }

        .btn-primary {
            background: #f8c537;
            color: #080d1a;
        }

        .btn-danger {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            color: #f87171;
        }

        /* health banner */
        #health-banner {
            display: none;
            background: rgba(234, 179, 8, 0.1);
            border-bottom: 1px solid rgba(234, 179, 8, 0.25);
            color: #fbbf24;
            font-size: 13px;
            padding: 10px 32px;
            text-align: center;
        }

        /* main */
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 32px 80px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .page-header .count {
            font-size: 14px;
            color: #64748b;
            font-weight: 400;
            margin-top: 2px;
        }

        .header-actions { display: flex; gap: 10px; align-items: center; }

        /* empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            color: #475569;
            text-align: center;
            gap: 12px;
        }

        .empty-state svg { opacity: 0.3; }
        .empty-state p { font-size: 15px; }

        /* loading */
        #constellations-loading {
            color: #475569;
            font-size: 14px;
            padding: 40px;
            text-align: center;
        }

        /* grid */
        .constellation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* card */
        .constellation-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(94, 234, 212, 0.1);
            border-radius: 14px;
            overflow: hidden;
            transition: border-color 0.2s, transform 0.2s;
        }
        .constellation-card:hover {
            border-color: rgba(94, 234, 212, 0.3);
            transform: translateY(-2px);
        }

        .card-preview {
            width: 100%;
            aspect-ratio: 16/9;
            background: #0a0f1c;
            cursor: pointer;
        }
        .card-preview svg { width: 100%; height: 100%; display: block; }

        .card-body {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .card-name {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
            font-size: 13px;
            font-family: inherit;
        }
        .icon-btn:hover { background: rgba(94,234,212,0.12); color: #5eead4; border-color: rgba(94,234,212,0.25); }
        .icon-btn.del:hover { background: rgba(239,68,68,0.12); color: #f87171; border-color: rgba(239,68,68,0.25); }
        .icon-btn.cmp.active { background: rgba(248,197,55,0.15); color: #f8c537; border-color: rgba(248,197,55,0.4); }

        /* card selected for compare */
        .constellation-card.compare-selected {
            border-color: rgba(248,197,55,0.6);
            box-shadow: 0 0 0 2px rgba(248,197,55,0.2);
        }

        /* compare modal */
        .compare-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .compare-overlay.open { display: flex; }

        .compare-box {
            background: #0f172a;
            border: 1px solid rgba(94,234,212,0.15);
            border-radius: 16px;
            padding: 24px;
            width: 520px;
            max-width: 92vw;
            max-height: 80vh;
            overflow-y: auto;
        }
        .compare-box h3 { font-size: 15px; color: #f1f5f9; margin-bottom: 18px; }
        .compare-section { margin-bottom: 16px; }
        .compare-label { font-size: 12px; color: #64748b; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .compare-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .compare-col-title { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
        .compare-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; border: 1px solid; }
        .chip-teal  { background: rgba(94,234,212,0.1);  border-color: rgba(94,234,212,0.3);  color: #5eead4; }
        .chip-yellow{ background: rgba(248,197,55,0.1);  border-color: rgba(248,197,55,0.3);  color: #f8c537; }
        .chip-purple{ background: rgba(192,132,252,0.1); border-color: rgba(192,132,252,0.3); color: #c084fc; }
        .chip-green { background: rgba(52,211,153,0.1);  border-color: rgba(52,211,153,0.3);  color: #34d399; }
        .chip-orange{ background: rgba(251,146,60,0.1);  border-color: rgba(251,146,60,0.3);  color: #fb923c; }
        .compare-empty { font-size: 12px; color: #475569; }
        .compare-divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 16px 0; }
        .compare-footer { display: flex; justify-content: flex-end; }
        .compare-col-a { color: #f8c537; }
        .compare-col-b { color: #c084fc; }
        .compare-diff { font-size: 13px; color: #94a3b8; line-height: 1.6; margin-bottom: 18px; }

    </style>
</head>
<body>

    <nav class="navbar">
        <span class="navbar-logo">✦ MindMap</span>
        <div class="navbar-right">
            <button type="button" class="btn btn-ghost" onclick="window.location.href='login.html'">Log out</button>
            <div class="user-pill">
                <div class="user-star" id="account-icon"></div>
                <div class="user-info">
                    <div class="name" id="user-name">—</div>
                    <div class="email" id="user-email">—</div>
                </div>
            </div>
        </div>
    </nav>

    <div id="health-banner"></div>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>My Constellations</h1>
                <div class="count" id="constellations-count-label">Loading...</div>
            </div>
            <div class="header-actions">
                <button type="button" class="btn btn-primary" onclick="window.location.href='newc.html'">+ New Constellation</button>
            </div>
        </div>

        <div id="constellations-loading">Loading your constellations...</div>
        <div class="constellation-grid" id="constellation-list"></div>
    </main>

    <!-- compare modal -->
    <div class="compare-overlay" id="compare-modal">
        <div class="compare-box">
            <h3 id="compare-title"></h3>
            <p id="compare-diff" class="compare-diff"></p>
            <div id="compare-body"></div>
            <hr class="compare-divider">
            <div class="compare-footer">
                <button type="button" class="btn btn-ghost" onclick="closeCompare()">Close</button>
            </div>
        </div>
    </div>

    <script>
        // --- init ---
        window.constellationMap = {};
        let compareSelection = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) { window.location.href = 'login.html'; return; }

            document.getElementById('user-name').textContent = user.username || user.name || '';
            document.getElementById('user-email').textContent = user.email || '';
            generateUserStar();

            checkHealth();

            await loadSavedConstellations(user.id);
        });

        // --- compare ---
        function toggleCompare(cId) {
            const card = document.getElementById(`preview-${cId}`)?.closest('.constellation-card');
            const btn  = document.getElementById(`cmp-btn-${cId}`);

            if (compareSelection.includes(cId)) {
                compareSelection = compareSelection.filter(id => id !== cId);
                card?.classList.remove('compare-selected');
                btn?.classList.remove('active');
                return;
            }

            if (compareSelection.length >= 2) {
                const old = compareSelection.shift();
                document.getElementById(`preview-${old}`)?.closest('.constellation-card')?.classList.remove('compare-selected');
                document.getElementById(`cmp-btn-${old}`)?.classList.remove('active');
            }

            compareSelection.push(cId);
            card?.classList.add('compare-selected');
            btn?.classList.add('active');

            if (compareSelection.length === 2) showComparison(compareSelection[0], compareSelection[1]);
        }

        function showComparison(idA, idB) {
            const a = window.constellationMap[idA];
            const b = window.constellationMap[idB];
            const dataA = typeof a.constellation_data === 'string' ? JSON.parse(a.constellation_data) : a.constellation_data;
            const dataB = typeof b.constellation_data === 'string' ? JSON.parse(b.constellation_data) : b.constellation_data;

            const wordsA = new Set((dataA.inputWords || '').split(',').map(w => w.trim().toLowerCase()).filter(Boolean));
            const wordsB = new Set((dataB.inputWords || '').split(',').map(w => w.trim().toLowerCase()).filter(Boolean));
            const common  = [...wordsA].filter(w => wordsB.has(w));
            const onlyA   = [...wordsA].filter(w => !wordsB.has(w));
            const onlyB   = [...wordsB].filter(w => !wordsA.has(w));

            const careersA = new Set(dataA.careers || []);
            const careersB = new Set(dataB.careers || []);
            const commonCareers = [...careersA].filter(c => careersB.has(c));

            const econA = new Set(dataA.economy || []);
            const econB = new Set(dataB.economy || []);
            const commonEcon = [...econA].filter(e => econB.has(e));

            const total = wordsA.size + wordsB.size - common.length;
            let diffText = '';
            if (common.length === 0) {
                diffText = `These two constellations have nothing in common — they explore completely different areas.`;
            } else if (onlyA.length === 0 && onlyB.length === 0) {
                diffText = `These two constellations are identical — same words, same direction.`;
            } else if (common.length >= total * 0.7) {
                diffText = `These two are very similar. The main difference is that <b>${b.name || 'B'}</b> ${onlyB.length ? `also explores: <i>${onlyB.join(', ')}</i>` : `covers no extra ground`}.`;
            } else if (onlyA.length === 0) {
                diffText = `<b>${a.name || 'A'}</b> is fully contained inside <b>${b.name || 'B'}</b> — everything in it also appears there, plus: <i>${onlyB.join(', ')}</i>.`;
            } else if (onlyB.length === 0) {
                diffText = `<b>${b.name || 'B'}</b> is fully contained inside <b>${a.name || 'A'}</b> — everything in it also appears there, plus: <i>${onlyA.join(', ')}</i>.`;
            } else {
                diffText = `They share a common base but go in different directions — <b>${a.name || 'A'}</b> uniquely explores <i>${onlyA.join(', ')}</i>, while <b>${b.name || 'B'}</b> goes toward <i>${onlyB.join(', ')}</i>.`;
            }

            const chips = (words, cls) => words.length
                ? words.map(w => `<span class="chip ${cls}">${w}</span>`).join('')
                : `<span class="compare-empty">none</span>`;

            document.getElementById('compare-title').textContent =
                `${a.name || 'Untitled'}  vs  ${b.name || 'Untitled'}`;
            document.getElementById('compare-diff').innerHTML = diffText;

            document.getElementById('compare-body').innerHTML = `
                <div class="compare-section">
                    <div class="compare-label">words in common (${common.length})</div>
                    <div class="compare-chips">${chips(common, 'chip-teal')}</div>
                </div>
                <div class="compare-row">
                    <div>
                        <div class="compare-col-title compare-col-a">${a.name || 'A'}</div>
                        <div class="compare-chips">${chips(onlyA, 'chip-yellow')}</div>
                    </div>
                    <div>
                        <div class="compare-col-title compare-col-b">${b.name || 'B'}</div>
                        <div class="compare-chips">${chips(onlyB, 'chip-purple')}</div>
                    </div>
                </div>
                ${commonCareers.length ? `
                <div class="compare-section">
                    <div class="compare-label">shared career suggestions (${commonCareers.length})</div>
                    <div class="compare-chips">${chips(commonCareers, 'chip-green')}</div>
                </div>` : ''}
                ${commonEcon.length ? `
                <div class="compare-section">
                    <div class="compare-label">shared economic sectors (${commonEcon.length})</div>
                    <div class="compare-chips">${chips(commonEcon, 'chip-orange')}</div>
                </div>` : ''}
            `;

            document.getElementById('compare-modal').classList.add('open');
        }

        function closeCompare() {
            document.getElementById('compare-modal').classList.remove('open');
            compareSelection.forEach(id => {
                document.getElementById(`preview-${id}`)?.closest('.constellation-card')?.classList.remove('compare-selected');
                document.getElementById(`cmp-btn-${id}`)?.classList.remove('active');
            });
            compareSelection = [];
        }

        // --- load constellations ---
        async function loadSavedConstellations(userId) {
            const token = localStorage.getItem('token');
            const listEl = document.getElementById('constellation-list');
            const loadingEl = document.getElementById('constellations-loading');

            try {
                const response = await fetch(`http://localhost:3002/constellations/${userId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Server error');

                const constellations = await response.json();
                loadingEl.style.display = 'none';

                document.getElementById('constellations-count-label').textContent =
                    constellations.length === 0 ? 'No constellations yet' :
                    `${constellations.length} constellation${constellations.length !== 1 ? 's' : ''}`;

                if (constellations.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1">
                            <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                <path d="M12 3v1m0 16v1M4.22 4.22l.7.7m13.86 13.86l.7.7M3 12H4m16 0h1M4.22 19.78l.7-.7M18.36 5.64l.7-.7"/>
                                <circle cx="12" cy="12" r="4"/>
                            </svg>
                            <p>No constellations yet. Create your first one!</p>
                        </div>`;
                    return;
                }

                constellations.forEach(c => {
                    const cId = c.constellation_id;
                    window.constellationMap[cId] = c;

                    const card = document.createElement('div');
                    card.className = 'constellation-card';
                    card.innerHTML = `
                        <div class="card-preview" id="preview-${cId}" onclick="viewConstellation(${cId})"></div>
                        <div class="card-body">
                            <div class="card-name" title="${c.name || 'Untitled'}">${c.name || 'Untitled'}</div>
                            <div class="card-actions">
                                <button type="button" class="icon-btn" title="Edit" onclick="viewConstellation(${cId})">✏️</button>
                                <button type="button" class="icon-btn" title="PNG" onclick="downloadConstellationImage(window.constellationMap[${cId}])">🖼</button>
                                <button type="button" class="icon-btn" title="CSV Report" onclick="downloadConstellationReport(window.constellationMap[${cId}])">📄</button>
                                <button type="button" class="icon-btn cmp" title="Compare" id="cmp-btn-${cId}" onclick="toggleCompare(${cId})">⇄</button>
                                <button type="button" class="icon-btn del" title="Delete" onclick="deleteConstellation(${cId})">🗑</button>
                            </div>
                        </div>`;
                    listEl.appendChild(card);

                    if (c.constellation_data) {
                        try {
                            const data = typeof c.constellation_data === 'string'
                                ? JSON.parse(c.constellation_data) : c.constellation_data;
                            const svgEl = createMiniConstellation(data, 300);
                            document.getElementById(`preview-${cId}`).appendChild(svgEl);
                        } catch (e) { console.error('Preview error:', e); }
                    }
                });

            } catch (error) {
                loadingEl.textContent = 'Failed to load constellations.';
                console.error(error);
            }
        }

        // --- actions ---
        function viewConstellation(cId) {
            const c = window.constellationMap[cId];
            if (!c) return;
            localStorage.setItem('editConstellation', JSON.stringify(c));
            window.location.href = 'newc.html?edit=' + cId;
        }

        async function deleteConstellation(cId) {
            if (!confirm('Delete this constellation? This cannot be undone.')) return;
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`http://localhost:3002/constellation/${cId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) return alert('Delete failed.');
                document.getElementById(`preview-${cId}`)?.closest('.constellation-card')?.remove();
                delete window.constellationMap[cId];
                const remaining = Object.keys(window.constellationMap).length;
                document.getElementById('constellations-count-label').textContent =
                    `${remaining} constellation${remaining !== 1 ? 's' : ''}`;
            } catch (e) { alert('Network error.'); }
        }

        // --- health check ---
        async function checkHealth() {
            const banner = document.getElementById('health-banner');
            let nodeOk = false, flaskOk = false;
            try { nodeOk = (await fetch('http://localhost:3002/health')).ok; } catch (_) {}
            try { const f = await fetch('http://127.0.0.1:5000/health'); flaskOk = f.ok || f.status === 404; } catch (_) {}
            if (!nodeOk || !flaskOk) {
                banner.style.display = 'block';
                banner.textContent = `Some services are unreachable — Node: ${nodeOk ? '✓' : '✗'}  NLP: ${flaskOk ? '✓' : '✗'}`;
            }
        }

        // --- user star avatar ---
        function generateUserStar() {
            const iconEl = document.getElementById('account-icon');
            const name = document.getElementById('user-name').textContent || 'Guest';
            const colors = ['#f8c537', '#5eead4', '#ff6b6b', '#9fb2d7', '#c084fc', '#fb923c'];
            const color = colors[name.length % colors.length];
            iconEl.innerHTML = `<svg viewBox="0 0 24 24" fill="${color}" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279-7.416-3.967-7.417 3.967 1.481-8.279-6.064-5.828 8.332-1.151z"/>
            </svg>`;
        }

        // --- mini constellation SVG ---
        function _shapeNodePath(shape, cx, cy, r) {
            switch (shape) {
                case 'star': {
                    const ir = r * 0.42; let d = '';
                    for (let i = 0; i < 10; i++) {
                        const rad = i % 2 === 0 ? r : ir;
                        const a = (i * Math.PI / 5) - Math.PI / 2;
                        d += (i === 0 ? 'M' : 'L') + (cx + rad * Math.cos(a)).toFixed(2) + ',' + (cy + rad * Math.sin(a)).toFixed(2);
                    }
                    return d + 'Z';
                }
                case 'diamond':
                    return `M${cx},${cy-r} L${cx+r*0.65},${cy} L${cx},${cy+r} L${cx-r*0.65},${cy}Z`;
                default:
                    return `M${cx+r},${cy} A${r},${r} 0 1,1 ${cx-r},${cy} A${r},${r} 0 1,1 ${cx+r},${cy}Z`;
            }
        }

        function _brighten(hex) {
            const n = parseInt((hex || '#888888').replace('#',''), 16);
            return '#' + [n >> 16, (n >> 8) & 0xff, n & 0xff]
                .map(v => Math.min(255, v + 60).toString(16).padStart(2,'0')).join('');
        }

        function createMiniConstellation(data, size = 250) {
            const ns = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(ns, 'svg');
            svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
            svg.setAttribute('width', size); svg.setAttribute('height', size);
            svg.style.cssText = 'width:100%;height:100%;display:block;';

            const bg = document.createElementNS(ns, 'rect');
            bg.setAttribute('width', size); bg.setAttribute('height', size);
            bg.setAttribute('fill', '#0a0f1c');
            svg.appendChild(bg);

            if (!data?.nodes?.length) return svg;

            const style = data.style || {};
            const rootColor = style.rootColor || '#f8c537';
            const nodeColor = style.nodeColor || '#5eead4';
            const linkColor = style.linkColor || '#5eead4';
            const shape = style.shape || 'star';
            const nodeR = Math.max(3, size / 55);

            const nodes = data.nodes.map(n => ({ ...n }));
            const links = data.links || [];

            if (!nodes.every(n => isFinite(n.x) && isFinite(n.y))) {
                const rad = size * 0.35;
                nodes.forEach((n, i) => {
                    const a = (i / nodes.length) * 2 * Math.PI;
                    n.x = size/2 + Math.cos(a) * rad;
                    n.y = size/2 + Math.sin(a) * rad;
                });
            }

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            nodes.forEach(n => { minX = Math.min(minX,n.x); maxX = Math.max(maxX,n.x); minY = Math.min(minY,n.y); maxY = Math.max(maxY,n.y); });
            const pad = size * 0.15;
            const scaleF = Math.min((size-pad*2)/(maxX-minX||1), (size-pad*2)/(maxY-minY||1));
            const tx = (size-(maxX-minX)*scaleF)/2 - minX*scaleF;
            const ty = (size-(maxY-minY)*scaleF)/2 - minY*scaleF;
            const gx = v => v*scaleF+tx, gy = v => v*scaleF+ty;

            const byId = {};
            nodes.forEach(n => { byId[n.id] = n; });

            links.forEach(lnk => {
                const s = byId[lnk.source?.id ?? lnk.source];
                const t = byId[lnk.target?.id ?? lnk.target];
                if (!s || !t) return;
                const line = document.createElementNS(ns, 'line');
                line.setAttribute('x1', gx(s.x).toFixed(2)); line.setAttribute('y1', gy(s.y).toFixed(2));
                line.setAttribute('x2', gx(t.x).toFixed(2)); line.setAttribute('y2', gy(t.y).toFixed(2));
                line.setAttribute('stroke', linkColor); line.setAttribute('stroke-opacity', '0.45'); line.setAttribute('stroke-width', '1');
                svg.appendChild(line);
            });

            nodes.forEach(node => {
                const cx = gx(node.x), cy = gy(node.y);
                const isRoot = node.type === 'root';
                const color = isRoot ? rootColor : nodeColor;
                const r = isRoot ? nodeR * 1.4 : nodeR;
                const el = document.createElementNS(ns, 'path');
                el.setAttribute('d', _shapeNodePath(shape, cx, cy, r));
                el.setAttribute('fill', color);
                el.setAttribute('stroke', _brighten(color));
                el.setAttribute('stroke-width', '1');
                svg.appendChild(el);
            });

            return svg;
        }

        // --- download PNG ---
        function downloadConstellationImage(constellation) {
            let data = null;
            try { data = typeof constellation.constellation_data === 'string' ? JSON.parse(constellation.constellation_data) : constellation.constellation_data; } catch(e) {}
            if (!data) return alert('No data to export.');
            const exportSize = 1600;
            const svgEl = createMiniConstellation(data, exportSize);
            const svgString = new XMLSerializer().serializeToString(svgEl);
            const url = URL.createObjectURL(new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' }));
            const image = new Image();
            image.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = exportSize; canvas.height = exportSize;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#0a0f1c'; ctx.fillRect(0,0,exportSize,exportSize);
                ctx.drawImage(image,0,0,exportSize,exportSize);
                canvas.toBlob(blob => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `${constellation.name || 'constellation'}.png`;
                    a.click();
                }, 'image/png');
                URL.revokeObjectURL(url);
            };
            image.src = url;
        }

        // --- download CSV ---
        function csvEscape(val) {
            const s = String(val ?? '');
            return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s.replace(/"/g,'""')}"` : s;
        }

        function downloadConstellationReport(constellation) {
            let data = null;
            try { data = typeof constellation.constellation_data === 'string' ? JSON.parse(constellation.constellation_data) : constellation.constellation_data; } catch(e) {}
            if (!data) return alert('No data to export.');
            const rows = [];
            rows.push(['Constellation Report']);
            rows.push(['Name', csvEscape(constellation.name || 'Untitled')]);
            rows.push(['Nodes', (data.nodes||[]).length]);
            rows.push(['Links', (data.links||[]).length]);
            rows.push([]);
            rows.push(['NODES']); rows.push(['Word','Type','Categories']);
            (data.nodes||[]).forEach(n => rows.push([csvEscape(n.id), csvEscape(n.type||''), csvEscape((n.categories||[]).join('; '))]));
            rows.push([]); rows.push(['CONNECTIONS']); rows.push(['Source','Target']);
            (data.links||[]).forEach(l => rows.push([csvEscape(l.source?.id??l.source), csvEscape(l.target?.id??l.target)]));
            rows.push([]); rows.push(['ECONOMIC TAGS']); rows.push(['Tag']);
            (data.economy||[]).forEach(e => rows.push([csvEscape(e)]));
            rows.push([]); rows.push(['TRENDING TOPICS']); rows.push(['Topic']);
            (data.trends||[]).forEach(t => rows.push([csvEscape(t)]));
            rows.push([]); rows.push(['SUGGESTED CAREERS']); rows.push(['Career']);
            (data.careers||[]).forEach(c => rows.push([csvEscape(c)]));
            const csv = rows.map(r => r.join(',')).join('\r\n');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob(['﻿'+csv], { type: 'text/csv;charset=utf-8' }));
            a.download = `${constellation.name||'constellation'}-report.csv`;
            a.click();
        }
    </script>
